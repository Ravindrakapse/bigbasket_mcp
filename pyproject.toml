[project]
name = "bigbasket-mcp"
version = "1.0.0"
description = "Automate grocery shopping on BigBasket from Claude. Search, cart, address and checkout over the BigBasket web APIs driven through a real browser session."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["playwright==1.57.0", "mcp>=1.2.0", "python-dotenv"]

[project.scripts]
bigbasket-mcp = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
